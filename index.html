<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            /* Variáveis de cores (editáveis no admin) */
            --bg-color: #ffffff;
            --grid-color: #b3d9ff;
            --border-color: #000000;
            --text-weekday: #000000;
            --text-daynum: #ff0000;
            --text-month: #000000;
            --text-intro: #000000;
            --text-activity: #800000;
            --text-quote: #00008b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 25px 25px;
            background-position: center center;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* TELA PRINCIPAL */
        #main-view {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            border: 4px solid var(--border-color);
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            background-color: transparent;
        }

        .weekday {
            font-size: 3rem;
            color: var(--text-weekday);
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .date-box {
            border: 3px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 20px 20px 20px;
            margin-bottom: 30px;
            background-color: transparent;
        }

        .day-num {
            font-size: 11rem;
            line-height: 0.85;
            color: var(--text-daynum);
            letter-spacing: -5px;
        }

        .month {
            font-size: 3.2rem;
            color: var(--text-month);
            letter-spacing: -1px;
            margin-top: 10px;
        }

        .intro-text {
            font-size: 2.2rem;
            color: var(--text-intro);
            margin-bottom: 10px;
        }

        .activity {
            font-size: 4rem;
            color: var(--text-activity);
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .quote {
            font-size: 1.3rem;
            color: var(--text-quote);
            text-transform: uppercase;
        }

        /* --- REGRAS PARA ADAPTAÇÃO EM ECRÃS DE TELEMÓVEL --- */
        @media (max-width: 500px) {
            body {
                background-size: 20px 20px; /* Reduz a malha quadriculada */
            }
            .card {
                padding: 25px 15px;
                border-width: 3px;
                border-radius: 30px;
            }
            .weekday {
                font-size: 2.1rem;
                margin-bottom: 15px;
            }
            .date-box {
                padding: 5px 15px 15px 15px;
                border-width: 2px;
                margin-bottom: 20px;
            }
            .day-num {
                font-size: 7.5rem;
                letter-spacing: -3px;
            }
            .month {
                font-size: 2.1rem;
            }
            .intro-text {
                font-size: 1.6rem;
            }
            .activity {
                font-size: 2.8rem;
                margin-bottom: 15px;
            }
            .quote {
                font-size: 1rem;
            }
        }

        /* ÁREA ADMIN */
        #admin-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 20px;
            flex-direction: column;
            align-items: center;
        }

        .admin-content {
            width: 100%;
            max-width: 600px;
        }

        .admin-section {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .admin-section h3 {
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #4da6ff;
        }

        .color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 500px) {
            .color-grid { grid-template-columns: 1fr; } /* Uma coluna no telemóvel */
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group label { margin-bottom: 5px; font-size: 0.9rem; }

        .form-group input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #111;
            color: #fff;
        }

        .form-group input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            background: none;
        }

        .day-config {
            border: 1px solid #444;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #1a1a1a;
        }
        
        .day-config h4 { color: #ff9900; margin-bottom: 10px; font-size: 1.2rem; }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4da6ff;
            color: #000;
            margin: 5px 5px 20px 0;
            transition: 0.2s;
        }

        button:hover { background-color: #3388dd; }
        .btn-cancel { background-color: #666; color: white; }
        .btn-cancel:hover { background-color: #888; }

        .admin-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #000;
            color: #fff;
            opacity: 0.3;
            border-radius: 50px;
            padding: 10px 15px;
        }
        .admin-btn:hover { opacity: 1; }
    </style>

<body>

    <button class="admin-btn" onclick="toggleAdmin()">⚙️ Configurações</button>

    <div id="main-view">
        <div class="card">
            <div class="weekday" id="display-weekday">Segunda -Feira</div>
            
            <div class="date-box">
                <div class="day-num" id="display-day-num">28</div>
                <div class="month" id="display-month">Setembro</div>
            </div>
            
            <div class="intro-text">Hoje é dia de</div>
            <div class="activity" id="display-activity">Academia</div>
            <div class="quote" id="display-quote">FRASE MOTIVACIONAL</div>
        </div>
    </div>

    <div id="admin-view">
        <div class="admin-content">
            <h2>Configurações do Painel</h2>
            <br>
            
            <div class="admin-section">
                <h3>🎨 Cores e Estilo</h3>
                <div class="color-grid">
                    <div class="form-group"><label>Cor do Fundo da Página:</label><input type="color" id="color-bg"></div>
                    <div class="form-group"><label>Cor das Linhas (Caderno):</label><input type="color" id="color-grid"></div>
                    <div class="form-group"><label>Cor das Bordas:</label><input type="color" id="color-border"></div>
                    <div class="form-group"><label>Cor do Dia da Semana:</label><input type="color" id="color-weekday"></div>
                    <div class="form-group"><label>Cor do Número do Dia:</label><input type="color" id="color-daynum"></div>
                    <div class="form-group"><label>Cor do Mês:</label><input type="color" id="color-month"></div>
                    <div class="form-group"><label>Cor do Texto "Hoje é dia":</label><input type="color" id="color-intro"></div>
                    <div class="form-group"><label>Cor da Atividade:</label><input type="color" id="color-activity"></div>
                    <div class="form-group"><label>Cor da Frase:</label><input type="color" id="color-quote"></div>
                </div>
            </div>

            <div class="admin-section">
                <h3>📅 Planejamento Semanal</h3>
                <div id="days-container">
                    <!-- Gerado via JavaScript -->
                </div>
            </div>

            <div>
                <button onclick="saveData()">💾 Salvar Tudo</button>
                <button class="btn-cancel" onclick="toggleAdmin()">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = {
            colors: {
                bg: "#ffffff",
                grid: "#b3d9ff",
                border: "#000000",
                weekday: "#000000",
                daynum: "#ff0000",
                month: "#000000",
                intro: "#000000",
                activity: "#800000",
                quote: "#00008b"
            },
            schedule: [
                { dayName: "Domingo", activity: "Descanso", quote: "DIA DE REPOR AS ENERGIAS" },
                { dayName: "Segunda -Feira", activity: "Academia", quote: "O CORPO ALCANÇA O QUE A MENTE ACREDITA" },
                { dayName: "Terça -Feira", activity: "Ergométrica", quote: "FOCO, FORÇA E DETERMINAÇÃO" },
                { dayName: "Quarta -Feira", activity: "Academia", quote: "CADA GOTA DE SUOR CONTA" },
                { dayName: "Quinta -Feira", activity: "Ergométrica", quote: "A DOR DE HOJE É A FORÇA DE AMANHÃ" },
                { dayName: "Sexta -Feira", activity: "Academia", quote: "SUPERE SEUS LIMITES DE ONTEM" },
                { dayName: "Sábado", activity: "Livre", quote: "APROVEITE O FRUTO DA SUA DISCIPLINA" }
            ]
        };

        const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        
        let appData = {};

        function init() {
            loadData();
            updateMainScreen();
        }

        function loadData() {
            const savedData = localStorage.getItem('painelAtividadesData');
            if (savedData) {
                appData = JSON.parse(savedData);
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
            }
            applyColors();
        }

        function saveData() {
            appData.colors.bg = document.getElementById('color-bg').value;
            appData.colors.grid = document.getElementById('color-grid').value;
            appData.colors.border = document.getElementById('color-border').value;
            appData.colors.weekday = document.getElementById('color-weekday').value;
            appData.colors.daynum = document.getElementById('color-daynum').value;
            appData.colors.month = document.getElementById('color-month').value;
            appData.colors.intro = document.getElementById('color-intro').value;
            appData.colors.activity = document.getElementById('color-activity').value;
            appData.colors.quote = document.getElementById('color-quote').value;

            for (let i = 0; i < 7; i++) {
                appData.schedule[i].activity = document.getElementById(`act-${i}`).value;
                appData.schedule[i].quote = document.getElementById(`quote-${i}`).value;
            }

            localStorage.setItem('painelAtividadesData', JSON.stringify(appData));
            
            applyColors();
            updateMainScreen();
            toggleAdmin();
        }

        function applyColors() {
            const root = document.documentElement;
            root.style.setProperty('--bg-color', appData.colors.bg);
            root.style.setProperty('--grid-color', appData.colors.grid);
            root.style.setProperty('--border-color', appData.colors.border);
            root.style.setProperty('--text-weekday', appData.colors.weekday);
            root.style.setProperty('--text-daynum', appData.colors.daynum);
            root.style.setProperty('--text-month', appData.colors.month);
            root.style.setProperty('--text-intro', appData.colors.intro);
            root.style.setProperty('--text-activity', appData.colors.activity);
            root.style.setProperty('--text-quote', appData.colors.quote);
        }

        function updateMainScreen() {
            const today = new Date();
            const dayOfWeek = today.getDay(); 
            const dayOfMonth = today.getDate();
            const monthName = meses[today.getMonth()];

            document.getElementById('display-weekday').innerText = appData.schedule[dayOfWeek].dayName;
            document.getElementById('display-day-num').innerText = dayOfMonth;
            document.getElementById('display-month').innerText = monthName;

            document.getElementById('display-activity').innerText = appData.schedule[dayOfWeek].activity;
            document.getElementById('display-quote').innerText = appData.schedule[dayOfWeek].quote;
        }

        function buildAdminForm() {
            document.getElementById('color-bg').value = appData.colors.bg;
            document.getElementById('color-grid').value = appData.colors.grid;
            document.getElementById('color-border').value = appData.colors.border;
            document.getElementById('color-weekday').value = appData.colors.weekday;
            document.getElementById('color-daynum').value = appData.colors.daynum;
            document.getElementById('color-month').value = appData.colors.month;
            document.getElementById('color-intro').value = appData.colors.intro;
            document.getElementById('color-activity').value = appData.colors.activity;
            document.getElementById('color-quote').value = appData.colors.quote;

            const container = document.getElementById('days-container');
            container.innerHTML = ""; 

            appData.schedule.forEach((item, index) => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-config';
                dayDiv.innerHTML = `
                    <h4>${item.dayName}</h4>
                    <div class="form-group">
                        <label>Atividade:</label>
                        <input type="text" id="act-${index}" value="${item.activity}">
                    </div>
                    <div class="form-group">
                        <label>Frase:</label>
                        <input type="text" id="quote-${index}" value="${item.quote}">
                    </div>
                `;
                container.appendChild(dayDiv);
            });
        }

        function toggleAdmin() {
            const adminView = document.getElementById('admin-view');
            if (adminView.style.display === 'flex') {
                adminView.style.display = 'none';
            } else {
                buildAdminForm();
                adminView.style.display = 'flex';
            }
        }

        init();
    </script>

</body>
</html>
